[project]
name = "folio-user-permission-mapper"
version = "0.1.0"
description = ""
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Pavel Filippov", email = "pavel_filippov@epam.com" }]
requires-python = ">=3.14,<4.0"
dependencies = [
    "boto3>=1.43.126,<2.0.0",
    "requests>=2.34.2,<3.0.0",
    "click>=8.5.1,<9.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pydantic>=2.14.3,<3.0.0",
    "cachetools>=8.0.0,<9.0.0",
    "cryptography>=50.0.2,<51.0.0",
    "pyjwt>=2.15.1,<3.0.0",
    "mypy-boto3-s3>=1.43.106,<2.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
]

[project.scripts]
folio-permission-migration-cli = "folio_upm.cli:cli"

[dependency-groups]
dev = [
    "flake8>=7.5.0,<8.0.0",
    "flake8-bugbear>=26.10.27,<27.0.0",
    "black>=26.10.1,<27.0.0",
    "isort>=9.0.2,<10.0.0",
    "pytest>=9.2.0,<10.0.0",
    "types-cachetools>=7.0.0.20260713,<8.0.0",
    "boto3-stubs>=1.43.126,<2.0.0",
    "pyrefly>=1.4.1,<2.0.0",
    "types-openpyxl>=3.1.5.20261017,<4.0.0",
    "testcontainers>=4.15.0,<5.0.0",
    "wiremock>=2.7.0,<3.0.0",
]

[tool.poetry]
packages = [
    { include = "folio_upm", from = "src" },
    { include = "folio_upm_resource", from = "src" },
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
addopts = "-ra --tb=short --assert plain"
log_cli = true
log_cli_level = "DEBUG"
log_format = "[%(asctime)s] [%(levelname)-8s] [%(name)-40s] %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    # raised inside wiremock 2.7.0 itself (no newer release); remove once the library is fixed
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ['**/*venv/**', '**/tmp/**']

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
