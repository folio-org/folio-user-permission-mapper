[tool.poetry]
name = "folio-user-permission-mapper"
version = "0.1.0"
description = ""
authors = ["Pavel Filippov <pavel_filippov@epam.com>"]
license = "Apache License 2.0"
readme = "README.md"

packages = [
    { include = "folio_upm", from = "src" },
    { include = "folio_upm_resource", from = "src" }
]

[tool.poetry.scripts]
folio-permission-migration-cli = "folio_upm.cli:cli"

[tool.poetry.dependencies]
python = "^3.14"
boto3 = "^1.43.25"
dotenv = "^0.9.9"
requests = "^2.34.2"
poetry-core = "^2.4.1"
click = "^8.4.1"
openpyxl = "^3.1.5"
pydantic = "^2.13.4"
cachetools = "^7.1.4"
cryptography = "^48.0.0"
pyjwt = "^2.13.0"
mypy-boto3-s3 = "^1.43.14"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
flake8-bugbear = "^25.11.29"
black = "^26.5.1"
isort = "^8.0.1"
pytest = "^9.0.3"
types-cachetools = "^7.0.0.20260518"
types-click = "^7.1.8"
boto3-stubs = "^1.43.14"
pyrefly = "^1.0.0"
types-openpyxl = "^3.1.5.20260518"
testcontainers = { extras = ["minio"], version = "^4.14.2" }
wiremock = "^2.7.0"

[tool.black]
line-length = 120

[tool.isort]
line_length = 120

[tool.pytest.ini_options]
addopts = "-ra --tb=short --assert plain"
log_cli = true
log_cli_level = "DEBUG"
log_format = "[%(asctime)s] [%(levelname)-8s] [%(name)-40s] %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ['**/*venv/**', '**/tmp/**']

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
